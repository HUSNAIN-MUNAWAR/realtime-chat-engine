name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt ruff
      - name: Compile Python sources
        run: python -m compileall -q backend load_tests mlops scripts tests
      - name: Ruff undefined-name and import checks
        # The project intentionally uses compact one-line statements in its
        # existing demo surface; keep the CI gate focused on correctness.
        run: python -m ruff check backend load_tests mlops scripts tests --select F --ignore F401
      - name: Backend and runtime evidence tests
        run: python -m pytest -q backend/app/tests tests
        env:
          PYTHONPATH: backend

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
